name: Project Check

on:
  push:
    paths:
      - 'projects/AI-Finance-Operations-Agent/**'
      - '.github/workflows/project-check.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/AI-Finance-Operations-Agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile dashboard/app.py
      - run: pytest -q
